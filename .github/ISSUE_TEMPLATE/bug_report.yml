name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, job file (remove anything private), and UI steps.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `inferenceopt doctor --json`
      render: json
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Secrets are redacted automatically, but please double-check before posting.
      render: text
