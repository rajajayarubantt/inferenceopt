name: Feature request
description: Suggest a capability, runtime, hardware target or UI improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: hardware
    attributes:
      label: Hardware / runtime context
      description: GPU/CPU, OS, runtime and model, if relevant.
