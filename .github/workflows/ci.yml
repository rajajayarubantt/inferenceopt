name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: mypy (type-check every platform, not just the runner's)
        run: for p in linux darwin win32; do uv run mypy --platform "$p" || exit 1; done
      - name: SPDX headers
        run: git ls-files -z -- '*.py' '*.ts' '*.tsx' '*.mjs' | xargs -0 uv run python scripts/check_spdx.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Tests (hardware and runtime-dependent tests are skipped)
        run: >-
          uv run pytest --cov --cov-report=term-missing
          -m "not integration_llamacpp and not e2e and not hardware_nvidia
          and not hardware_vllm and not hardware_trtllm"

  integration-llamacpp:
    name: llama.cpp integration (real runtime, CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/inferenceopt-test
            ~/.local/share/inferenceopt/runtimes
          key: llamacpp-cpu-${{ runner.os }}-${{ hashFiles('scripts/fetch_test_model.py') }}
      - name: Install llama.cpp (stable CPU build, SHA-256 verified by our installer)
        run: |
          uv run inferenceopt runtimes install llamacpp --variant cpu --yes
          echo "INFERENCEOPT_TEST_LLAMA_SERVER=$(find ~/.local/share/inferenceopt/runtimes -name llama-server -type f | head -1)" >> "$GITHUB_ENV"
      - name: Fetch pinned test model
        run: uv run python scripts/fetch_test_model.py
      - name: Integration tests
        run: uv run pytest -m integration_llamacpp -v -rs

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  api-client:
    name: API client is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - run: uv run python scripts/gen_api_client.py
      - name: Fail if the generated client changed
        run: |
          git diff --exit-code -- ui/openapi.json ui/src/api/schema.d.ts || {
            echo "::error::Run 'uv run python scripts/gen_api_client.py' and commit the result."
            exit 1
          }

  build:
    uses: ./.github/workflows/build.yml
